apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend }
    spec:
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          ports:
            - containerPort: {{ .Values.backend.port }}
          livenessProbe:
            httpGet:
              path: /hello  
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /hello
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          env:
            - name: PORT
              value: "{{ .Values.backend.port }}"
            - name: MONGO_URI
              value: "{{ .Values.docdb.mongoUri }}"
          volumeMounts:
            - name: docdb-ca
              mountPath: /certs
      volumes:
        - name: docdb-ca
          configMap:
            name: {{ .Values.docdb.configMapName }}