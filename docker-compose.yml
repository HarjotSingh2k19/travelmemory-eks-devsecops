version: "3.9"
services:
  mongo:
    image: mongo:6
    ports:
      - "27017:27017"

  backend:
    build: ./backend
    environment:
      MONGO_URI: mongodb://mongo:27017/travelmemory
      PORT: 3000   
    depends_on:
      - mongo
    ports:
      - "3000:3000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"